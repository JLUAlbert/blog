# ============================================================
# [config.site] —— 站点全局元信息
# ============================================================
[config.site]
# 站点主标题（浏览器标签、分享卡片里出现）。✅ 保留
title = "Albert's Blog"

# 站点描述（SEO meta description）。✅ 保留，或写成一句你自己的话
description = "Think independently. Write honestly. Learn endlessly. Live freely."

# 首页浏览器标签标题（完整版）。✅ 保留
pageTitle = "Albert's Blog | Space of Freedom"

# 页面 meta description（与 description 内容一致即可）。✅ 保留
pageDescription = "Think independently. Write honestly. Learn endlessly. Live freely."

# 站点正式 URL。用于生成 RSS、sitemap、canonical 链接。🚨 必改：部署后填你自己的真实域名；现在没域名先保持原样，但上线前一定要换
# 🚨 TODO：上线时改成真实域名（GitHub Pages 会自动覆盖这个值）
url = "https://blog.example.com"

# 站点公开仓库地址（页脚会链到这个地址）。🚨 必改：改成你自己的仓库，如 https://github.com/Albert/xxx；不想公开可删掉本行
# 🚨 TODO：改成 https://github.com/<你的用户名>/blog
repository = "https://github.com/your-name/blog"

# 页脚文案。
footerNote = "© 2026 Albert. Built with Astro."

# ============================================================
# [config.theme] —— 主题色盘与 UI 语言
# ============================================================
[config.theme]
# 可用色盘：green-soft, green-vivid, rose-soft, pink-soft, purple-soft, blue-soft, orange-soft, brown-soft
# 主题色盘名。✏️ 建议改：挑一个你喜欢的，green-soft 是默认偏清爽的绿色
palette = "green-soft"

# 原生 UI 语言（按钮、分页、搜索提示等）。✏️ 建议改：中文用户建议 "zh-CN"；保留 "en" 也可以
lang = "zh-CN"

# ============================================================
# [config.fonts] —— 字体设置
# ============================================================
[config.fonts]
# 英文与数字字体。✅ 保留（Maple Mono 是模板主打的等宽圆体）
en = "Maple Mono"

# 代码字体。✅ 保留（Monaco 是系统经典等宽字体）
code = "Monaco"

# 中文正文字体。模板内可直接选：ChillRoundM、LXGW WenKai。✏️ 建议：ChillRoundM 偏圆润可爱，LXGW WenKai 偏手写宋体，按喜好选
zh = "ChillRoundM"

# 中文完整字体文件路径。✅ 保留（与上面的 zh 字体对应；切换字体时记得同步改这个路径）
file = "/fonts/ChillRoundM.ttf"

# ============================================================
# [config.code] —— 代码块渲染
# ============================================================
[config.code]
# 浅色模式代码高亮主题。✅ 保留（Catppuccin 系列审美在圈内很流行）
lightTheme = "catppuccin-latte"

# 深色模式代码高亮主题。✅ 保留
darkTheme = "catppuccin-macchiato"

# 是否显示行号。✅ 保留 true
lineNumbers = true

# 代码是否自动换行。✅ 保留 true（手机端体验更好）
wrap = true

# 是否保留缩进。✅ 保留 true
preserveIndent = true

# 代码折叠样式。✅ 保留（collapsible-auto 自动判断是否折叠长代码块）
collapseStyle = "collapsible-auto"

# ============================================================
# [config.math] —— 数学公式渲染
# ============================================================
[config.math]
# 公式渲染引擎。✅ 保留（katex 更快；如果你写 LaTeX 不多，也可以忽略这项）
render = "katex"

# ============================================================
# [config.comments] —— 评论系统主开关
# ============================================================
[config.comments]
# 是否启用评论。
enabled = true

# 评论服务商。✅ 保留 "none"（可选 giscus / utterances / waline）
provider = "none"

# 是否在文章页显示评论。✅ 保留 true（enabled=true 时才生效）
show_on_posts = true

# ============================================================
# [config.search] —— 站内搜索
# ============================================================
[config.search]
# 是否启用搜索。✅ 保留 true（Pagefind 静态索引，构建时生成）
enabled = true

# 唤起搜索的快捷键。✅ 保留（mod 在 Windows 上对应 Ctrl）
shortcut = "mod+k"

# 搜索框占位文案。✏️ 建议改：lang="zh-CN" 后可改成 "搜索文章..."
placeholder = "搜索文章…"

# 搜索结果数量上限。✅ 保留 6
maxResults = 6

# ============================================================
# [config.pages.blog] —— 博客列表页文案
# ============================================================
[config.pages.blog]
# 列表页大标题。✏️ 建议改：如 "写作笔记" / "Essays"
title = "Essays"

# 小标题（卡片上方的小字）。✏️ 建议改
kicker = "Notebook archive"

# 副标题。✏️ 建议改
subtitle = "Notes from the margins."

# 列表页说明文字。✏️ 建议改
note = "Field notes, drafts, and technical margins arranged for slow browsing."

# 每页文章数。✅ 保留 6（太长影响加载，太短翻页多）
postsPerPage = 6

# 日期格式（date-fns 语法）。✅ 保留 "yyyy-MM-dd"；中文习惯可用 "yyyy年M月d日"
dateFormat = "yyyy-MM-dd"

# 文章元信息分隔符。可用 "|" "/" 等符号，或特殊值 "icon"（用图标分隔）。✅ 保留 "icon"
metadataSeparator = "icon"

# 列表页封面样式。✅ 保留 "mask"（照片贴到卡片右侧，观感高级）；"card" 是带边框缩略图
coverImageStyle = "mask"

# ============================================================
# [config.pages.blog.categories] —— 分类页
# ============================================================
[config.pages.blog.categories]
# 分类页大标题。✅ 保留（除非你不想要分类页，整块可删 🗑️）
title = "Categories"

# 小标题。✅ 保留
kicker = "Browse notes"

# 副标题。✅ 保留
subtitle = ""

# 说明文字。✅ 保留
note = "A quiet index of recurring topics, gathered from article frontmatter."

# ============================================================
# [config.pages.blog.series] —— 系列页
# ============================================================
[config.pages.blog.series]
# 系列页大标题。✅ 保留（不需要可整块删除 🗑️）
title = "Series"

# 小标题。✅ 保留
kicker = "Reading paths"

# 副标题。✅ 保留
subtitle = ""

# 说明文字。✅ 保留
note = "Connected notes that can be followed in the order they were written."

# ============================================================
# [config.pages.projects] —— 项目页
# ============================================================
[config.pages.projects]
# 项目页大标题。✏️ 建议改：暂时没有项目，可先保留；不想要整个页面可删除 🗑️
title = "Projects"

# 小标题。✏️ 建议改
kicker = "Project shelf"

# 副标题。✏️ 建议改
subtitle = "Small tools and site systems."

# 说明文字。✏️ 建议改
note = "A compact shelf for implementation choices, releases, and publishing experiments."

# ============================================================
# [config.pages.vibe] —— Vibe 短记录页
# ============================================================
[config.pages.vibe]
# Vibe 页大标题。✅ 保留（不喜欢可删 🗑️；喜欢发短动态就留着）
title = "vibe"

# 小标题。✅ 保留
kicker = ""

# 副标题。✏️ 建议改：可写 "生活与编码碎片" 之类
subtitle = "Life and coding fragments."

# 说明文字。✏️ 建议改
note = "Not formal enough for blog posts, but still part of the story."

# 是否显示左侧时间轴。✅ 保留 true
showTrail = true

# ============================================================
# [config.pages.book] —— 书架
# ============================================================
[config.pages.book]
title = "书架"
subtitle = "读过的书，以及当时留下的评分。"
note = "按读完时间排列，没有读完的会标在心里。"

# ============================================================
# [config.pages.movie] —— 片单
# ============================================================
[config.pages.movie]
title = "片单"
subtitle = "看过的电影与剧集。"
note = "数据来自 Trakt，按最近一次观看时间排列。"

# ============================================================
# [config.comments.giscus / utterances / waline] —— 评论后端参数
# 目前 enabled=false，以下三块都不会生效，纯作预留。✅ 全部保留
# ============================================================
[config.comments.giscus]
# 评论仓库。✅ 保留空串（启用 giscus 时再填）
repo = ""
# giscus 仓库 ID。✅ 保留
repo_id = ""
# 讨论分类名。✅ 保留
category = ""
# 分类 ID。✅ 保留
category_id = ""
# 页面与讨论的映射方式。✅ 保留
mapping = "pathname"
# 严格匹配。✅ 保留
strict = "0"
# 是否启用表情。✅ 保留
reactions_enabled = "1"
# 是否输出元数据。✅ 保留
emit_metadata = "0"
# 输入框位置。✅ 保留
input_position = "top"
# 浅色主题。✅ 保留
light_theme = "light"
# 深色主题。✅ 保留
dark_theme = "dark"
# 界面语言。✅ 保留
lang = "zh-CN"
# 是否懒加载。✅ 保留
loading = "lazy"

[config.comments.utterances]
# 评论仓库。✅ 保留空串
repo = ""
# Issue 匹配方式。✅ 保留
issue_term = "pathname"
# Issue 标签。✅ 保留
label = "comment"
# 主题。✅ 保留
theme = "github-light"

[config.comments.waline]
# Waline 服务端地址。✅ 保留空串
server_url = ""
# 界面语言。✅ 保留
lang = "zh-CN"
# 深色模式选择器。✅ 保留
dark = "html.dark"
# 是否统计阅读量。✅ 保留
pageview = true
# 是否显示评论。✅ 保留
comment = true

# ============================================================
# [config.profile] —— 你的个人身份（这一段是整份配置里最重要的）
# ============================================================
[config.profile]
# 你的名字。
name = "Albert"

# 你的账号/昵称。
handle = "Albert Chan"

# 你的身份标签。🚨 必改：如 "Developer & Writer" / "独立开发者"
role = "A Cat Developer"

# 联系邮箱。
email = "dongmuhanchen@qq.com"

# 个人网站。🚨 必改：如果没部署可以暂时留空或改成你的 GitHub Pages
website = "https://blog.example.com"

# GitHub 主页。🚨 必改：改成你的 GitHub 用户名地址
# 🚨 TODO：改成你的 GitHub 主页
github = "https://github.com/your-name"

# 头像路径。✅ 保留路径，把自己头像文件放进 public/images/ 并改文件名即可
avatar = "/images/logo-thin.webp"

# ============================================================
# [[config.topNav.links]] —— 顶部导航栏
# 每一项是一个 [[config.topNav.links]] 数组元素，顺序即显示顺序
# ============================================================

# 首页入口。✅ 保留
[[config.topNav.links]]

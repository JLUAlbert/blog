module = "projects"

# Vibe 入口。✏️ 建议：同理，保留或删除
[[config.topNav.links]]
label = "Vibe"
module = "vibe"

# 书架入口。
[[config.topNav.links]]
label = "Books"
href = "/book"

# 片单入口。
[[config.topNav.links]]
label = "Movies"
href = "/movie"

# 关于页入口。✅ 保留
[[config.topNav.links]]
label = "About"
href = "/about"

# ============================================================
# [config.home] —— 首页（访客第一眼看到的东西，全部要改成你的）
# ============================================================
[config.home]

# 首页大字引语（轮播三行文字）。✏️ 建议改：换成你自己的座右铭/开场白
[config.home.quote]
text = [
  "独立思考，",
  "诚实书写，",
  "自由生活。",
]

# 首页自我介绍区。
[config.home.intro]
# 区块标题。
title = "关于这里"

# 显示的名字。
name = "Albert"

# 正文段落数组，一行一段。
body = [
  "这里是我的个人站：读书笔记、电影观感、一点政治经济学的思考，偶尔写诗。",
  "不做流量的生意，只记录自己想清楚的东西。",
  "写作是一种整理——把混乱的经验摊开，看看里面到底是什么。",
]

# 首页“最新动态”区块。
[config.home.latest]
# 最新文章显示条数。
count = 5

# 热力图显示周数。✅ 保留 24
heatmapWeeks = 24

# 是否在最新动态区块中显示热力图。✅ 保留 true
showHeatmapLatest = true

# 是否排除草稿。✅ 保留 true
excludeDraft = true

# 统计起始日期（空 = 自动）。✅ 保留空
startDate = ""

# 归档链接前缀（空 = 默认）。✅ 保留空
dateArchiveBaseHref = ""


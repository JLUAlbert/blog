# 站点配置：导航、文案、主题、身份信息。
# 改完 push 到 main 即自动上线，不需要重启服务。

# ---------------------------------------------------------------
# 全局元信息
# ---------------------------------------------------------------
[config.site]
title = "Albert's Blog"
description = "A personal digital garden for independent thought, reading, photography, and reflections on society. | 独立思考，诚实书写。"
pageTitle = "Albert's Blog | Space of Freedom"
pageDescription = "A personal digital garden for independent thought, reading, photography, and reflections on society. | 独立思考，诚实书写。"
# 主站域名，用于 RSS / sitemap / canonical。部署时由 DEPLOY_TARGET 与 SITE_URL 覆盖。
url = "https://jlualbert-blog.pages.dev/"
repository = "https://github.com/JLUAlbert/blog"
footerNote = "© 2026 Albert Chan"

# ---------------------------------------------------------------
# 主题色盘与 UI 语言
# 可选色盘：green-soft, green-vivid, rose-soft, pink-soft,
#           purple-soft, blue-soft, orange-soft, brown-soft
# ---------------------------------------------------------------
[config.theme]
palette = "green-soft"
lang = "zh-CN"

# ---------------------------------------------------------------
# 字体
# ---------------------------------------------------------------
[config.fonts]
en = "Libre Baskerville"
code = "Monaco"
zh = "LXGW WenKai"
# 中文全量字体（子集化后约 880KB，界面另有 300KB 子集按需加载）
file = "/fonts/LXGWWenKai.woff2"

# ---------------------------------------------------------------
# 代码块
# ---------------------------------------------------------------
[config.code]
lightTheme = "catppuccin-latte"
darkTheme = "catppuccin-macchiato"
lineNumbers = true
wrap = true
preserveIndent = true
collapseStyle = "collapsible-auto"

[config.math]
render = "katex"

# ---------------------------------------------------------------
# 评论（giscus：数据存在本仓库 Discussions）
# ---------------------------------------------------------------
[config.comments]
enabled = true
provider = "giscus"
show_on_posts = true

[config.search]
enabled = true
shortcut = "mod+k"
placeholder = "Search articles…"
maxResults = 6

# ---------------------------------------------------------------
# 各栏目页文案
# ---------------------------------------------------------------
[config.pages.blog]
title = "Essays"
kicker = ""
subtitle = "Essays and notes from the margins."
note = "Long-form writing, drafts, and field notes — arranged for slow browsing."
postsPerPage = 6
dateFormat = "yyyy-MM-dd"
metadataSeparator = "icon"
coverImageStyle = "mask"

[config.pages.blog.categories]
title = "Categories"
kicker = "Browse notes"
subtitle = ""
note = "A quiet index of recurring topics, gathered from article frontmatter."

[config.pages.blog.series]
title = "Series"
kicker = "Reading paths"
subtitle = ""
note = "Connected notes that can be followed in the order they were written."

[config.pages.vibe]
title = "vibe"
kicker = ""
subtitle = ""
note = "Short thoughts — not formal enough for posts, but still part of the story."
showTrail = true

[config.pages.movie]
title = "Movies"
subtitle = "Films and series I have watched."
note = "Synced from Trakt, sorted by most recent watch."

[config.comments.giscus]
repo = "JLUAlbert/blog"
repo_id = "R_kgDOVYiHtQ"
category = "Announcements"
category_id = "DIC_kwDOVYiHtc4DJs6w"
mapping = "pathname"
strict = "0"
reactions_enabled = "0"
emit_metadata = "0"
input_position = "top"
light_theme = "https://jlualbert-blog.pages.dev/giscus-light-transparent.css"
dark_theme = "transparent_dark"
lang = "zh-CN"
loading = "lazy"

# 以下两家为预留，provider 未切换到它们时不会生效。
[config.comments.utterances]
repo = ""
issue_term = "pathname"
label = "comment"
theme = "github-light"

[config.comments.waline]
server_url = ""
lang = "zh-CN"
dark = "html.dark"
pageview = true
comment = true

# ---------------------------------------------------------------
# 个人身份
# ---------------------------------------------------------------
[config.profile]
name = "Albert"
handle = "Albert Chan"
role = "Writer, reader, photographer, and independent thinker."
email = "dongmuhanchen@gmail.com"
website = "https://jlualbert-blog.pages.dev/"
github = "https://github.com/JLUAlbert"
avatar = "/images/avatar.jpg"

# ---------------------------------------------------------------
# 顶部导航（顺序即显示顺序）
# ---------------------------------------------------------------
[[config.topNav.links]]
label = "Home"
href = "/"

[[config.topNav.links]]
label = "Blog"
href = "/blog"

[[config.topNav.links]]
label = "Vibe"
module = "vibe"

[[config.topNav.links]]
label = "Movies"
href = "/movie"

# ---------------------------------------------------------------

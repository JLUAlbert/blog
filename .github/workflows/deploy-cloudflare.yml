name: Deploy to Cloudflare Pages

# 与 deploy-pages.yml 并列运行：一次 push 到 main，两平台同时上线（GitHub Pages + Cloudflare）。
# 前置条件（在 GitHub 仓库 Settings → Secrets and variables → Actions 里配置）：
#   CLOUDFLARE_API_TOKEN  — Cloudflare API Token（需 Pages:Edit 权限）
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare 账户 ID（dash.cloudflare.com 右侧可见）
#   CLOUDFLARE_PROJECT   — Pages 项目名，默认 jlualbert-blog
# 可选：仓库变量 SITE_URL（不设置时用 https://jlualbert-blog.pages.dev）

on:
  push:
    branches:
      - main
    # 片单底稿由发布台写入，本身不改变站点内容；等 Trakt sync 生成完再构建，
    # 避免一次同步先构建出一份「旧片单」。
    paths-ignore:
      - 'scripts/.trakt-fixture.json'
  # Trakt sync 生成的 Markdown 是用 Actions 自带令牌推的，不会再触发 push 事件，
  # 所以显式监听它的完成，保证新片单一定会被构建上线。
  workflow_run:
    workflows: ['Trakt sync']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  build:
    # 片单生成失败时不要构建，避免把半成品推上线
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
      # 主站域名：显式给 site，避免 CI 环境把它推导成 GitHub Pages 地址
      SITE_URL: ${{ vars.SITE_URL || 'https://jlualbert-blog.pages.dev' }}
      # 根域名部署（Cloudflare），base 固定为 '/'
      DEPLOY_TARGET: cloudflare
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # workflow_run 默认解析的是触发方任务的 sha，这里显式拉 main 最新提交
          # （含 Trakt sync 刚生成的片单 Markdown）
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      # 两条流水线用同一套检查，避免两个站点拿到不同质量的构建
      # 发布台 HTML 内嵌在模板字符串里，语法错误会让整页交互静默失效
      - name: Check publish page script
        run: npm run check:worker

      - name: Check formatting and lint
        run: npm run format:check

      # 注意：这里 base 保持 '/'（Cloudflare 是根域名部署）
      - name: Build site
        run: npm run build

      # Cloudflare Pages 用 Direct Upload 时，_worker.js 必须放在 dist/ 内，
      # 否则 /publish 等 Worker 路由会 404。Astro build 会清空 dist，故在 build 后复制。
      - name: Copy Worker into dist
        run: cp _worker.js dist/_worker.js

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-cloudflare
          path: ./dist
          retention-days: 1

  deploy-cloudflare:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-cloudflare
          path: ./dist

      - name: Deploy to Cloudflare Pages (Direct Upload)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT || 'jlualbert-blog' }}

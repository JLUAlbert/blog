name: Trakt sync

# 手动触发：Trakt API 在 GitHub Actions 出口 IP 上常被 Cloudflare 拦截，
# 定时运行只会每周留下一条失败记录。需要更新片单时在 Actions 里点 Run workflow。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trakt-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore Trakt token
        env:
          TRAKT_TOKEN: ${{ secrets.TRAKT_TOKEN }}
        run: |
          printf '%s' "$TRAKT_TOKEN" > .trakt-token.json
          wc -c .trakt-token.json

      - name: Run Trakt sync
        env:
          TRAKT_CLIENT_ID: kPI6oQBbAcEpTjfRsn_DAo5mOOqgkYon3z27QFoDl-o
        run: node scripts/trakt-sync.mjs

      - name: Commit and push
        run: |
          git config user.name "trakt-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/movie
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: weekly trakt sync"
            git push
          fi

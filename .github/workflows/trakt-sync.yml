name: Trakt sync

# 由发布台的「同步片单」按钮触发。Trakt 会拦 GitHub Actions 的出口 IP，
# 所以联网取数与凭据续期都在发布台完成；这里只读发布台写回的底稿，
# 离线生成 Movies 的 Markdown，完全不访问 Trakt。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trakt-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build movie markdown
        run: |
          if [ -f scripts/.trakt-fixture.json ]; then
            node scripts/trakt-sync.mjs --fixture=scripts/.trakt-fixture.json
          else
            node scripts/trakt-sync.mjs
          fi

      - name: Commit and push
        run: |
          git config user.name "trakt-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/movie
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh movie shelf"
            git pull --rebase origin main
            git push
          fi

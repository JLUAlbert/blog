name: Weekly Trakt sync

on:
  schedule:
    # 每周一 UTC 02:00（北京时间 10:00）
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trakt-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Trakt token
        env:
          TRAKT_TOKEN: ${{ secrets.TRAKT_TOKEN }}
        run: |
          printf '%s' "$TRAKT_TOKEN" > .trakt-token.json
          wc -c .trakt-token.json

      - name: Run Trakt sync
        env:
          TRAKT_CLIENT_ID: kPI6oQBbAcEpTjfRsn_DAo5mOOqgkYon3z27QFoDl-o
        run: node scripts/trakt-sync.mjs

      - name: Commit and push
        run: |
          git config user.name "trakt-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/movie
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: weekly trakt sync"
            git push
          fi

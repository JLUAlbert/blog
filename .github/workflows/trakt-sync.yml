name: Trakt sync

# 手动触发：Trakt API 在 GitHub Actions 出口 IP 上常被 Cloudflare 拦截，
# 定时运行只会每周留下一条失败记录。需要更新片单时在 Actions 里点 Run workflow。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trakt-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore Trakt token
        env:
          TRAKT_TOKEN: ${{ secrets.TRAKT_TOKEN }}
        run: |
          printf '%s' "$TRAKT_TOKEN" > .trakt-token.json
          wc -c .trakt-token.json

      - name: Run Trakt sync
        env:
          TRAKT_CLIENT_ID: kPI6oQBbAcEpTjfRsn_DAo5mOOqgkYon3z27QFoDl-o
        # Trakt 前的 Cloudflare 偶尔会拦 GitHub Actions 的出口 IP；发布台一键触发时
        # 自动重试几次，避免用户看到一次偶发失败还要手动再点。
        run: |
          for attempt in 1 2 3; do
            if node scripts/trakt-sync.mjs; then exit 0; fi
            echo "第 $attempt 次同步失败，20 秒后重试"
            sleep 20
          done
          exit 1

      - name: Commit and push
        run: |
          git config user.name "trakt-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/movie
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: weekly trakt sync"
            git push
          fi
